<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ravi+Prakash&family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Light theme (default) — bone editorial ───────────────── */
    :root {
      --bg-base:        #f4efe6;
      --bg-panel:       #faf7f1;
      --bg-raised:      #ebe4d6;
      --bg-hover:       #e0d8c5;
      --border:         #d9cfbe;
      --border-strong:  #1a1410;
      --text-primary:   #1a1410;
      --text-muted:     #4a3d33;
      --text-faint:     #847465;
      --accent:         #c8501e;
      --accent-deep:    #a23e15;
      --accent-dim:     #fde6dc;
      --green:          #4f6b4a;
      --green-dim:      #dde8d8;
      --red:            #c8501e;
      --red-dim:        #fde6dc;
      --amber:          #b07219;
      --amber-dim:      #fbeed1;
      --btn-scan-text:  #f4efe6;
      --body-bg:        #ebe4d6;
      --radius: 4px;
      --font-mono: 'JetBrains Mono', monospace;
      --font-ui:   'DM Sans', sans-serif;
      --font-wordmark: 'Ravi Prakash', 'DM Sans', sans-serif;
    }

    /* ── Dark theme ─────────────────────────────────────────────── */
    html.theme-dark {
      --bg-base:        #1a1410;
      --bg-panel:       #221b15;
      --bg-raised:      #2a2118;
      --bg-hover:       #332820;
      --border:         #3d3329;
      --border-strong:  #f4efe6;
      --text-primary:   #f4efe6;
      --text-muted:     #b8a690;
      --text-faint:     #6e5e4f;
      --accent:         #e87a45;
      --accent-deep:    #c8501e;
      --accent-dim:     #3a1f12;
      --green:          #8fb087;
      --green-dim:      #1f2a1d;
      --red:            #e87a45;
      --red-dim:        #3a1f12;
      --amber:          #d8a458;
      --amber-dim:      #2e2410;
      --btn-scan-text:  #1a1410;
      --body-bg:        #100c08;
    }

    body {
      background: var(--body-bg);
      min-height: 100vh;
      font-family: var(--font-ui);
      font-size: 14px;
      color: var(--text-primary);
    }

    /* ── Lucide icon helper ────────────────────────────────────── */
    .icon {
      display: inline-block;
      vertical-align: -3px;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .icon-spin { animation: spin 0.8s linear infinite; }

    /* ── Layout ────────────────────────────────────────────────── */
    .sidebar {
      background: var(--bg-base);
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 18px 18px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel);
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 14px;
    }
    .dog-wrap {
      width: 56px; height: 56px; flex-shrink: 0;
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .dog-wrap::after {
      content: "";
      position: absolute; bottom: 2px; right: 2px;
      width: 12px; height: 12px;
      background: var(--accent);
      border: 2px solid var(--bg-panel);
      border-radius: 50%;
    }
    #barkerSvg { width: 44px; height: 44px; display: block; }

    /* ── Header text ───────────────────────────────────────────── */
    .header-text { min-width: 0; }
    .header-title {
      font-family: var(--font-wordmark);
      font-size: 32px;
      font-weight: 400;
      line-height: 1;
      color: var(--text-primary);
      letter-spacing: 0.005em;
    }
    .header-status { font-size: 12px; color: var(--text-muted); margin-top: 6px; font-family: var(--font-mono); letter-spacing: 0.02em; }
    .header-status.happy      { color: var(--green); }
    .header-status.sad        { color: var(--red); }
    .header-status.judgemental { color: var(--amber); }

    /* ── Theme toggle button ───────────────────────────────────── */
    .btn-theme {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .btn-theme:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--text-primary); }

    /* ── Sidebar body ──────────────────────────────────────────── */
    .sidebar-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }

    /* ── Scan / export buttons ─────────────────────────────────── */
    .btn-scan {
      width: 100%;
      padding: 14px 16px;
      background: var(--text-primary);
      color: var(--bg-base);
      border: none;
      border-radius: 999px;
      font-family: var(--font-ui);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-scan:hover { background: var(--accent); transform: translateY(-1px); }
    .btn-scan:active { transform: translateY(0); }
    .btn-scan.scanning { background: var(--bg-raised); color: var(--text-muted); cursor: default; }
    .btn-export {
      width: 100%;
      padding: 9px 14px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .btn-export:hover  { background: var(--bg-hover); color: var(--text-primary); border-color: var(--text-primary); }
    .btn-export.copied { background: var(--green-dim); border-color: var(--green); color: var(--green); }

    /* ── Section labels ────────────────────────────────────────── */
    .section-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Toggles ───────────────────────────────────────────────── */
    .toggles { display: flex; flex-direction: column; gap: 1px; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 10px; border-radius: var(--radius); cursor: pointer; transition: background 0.1s; gap: 10px; }
    .toggle-row:hover { background: var(--bg-hover); }
    .toggle-row.on { background: var(--bg-panel); }
    .toggle-row.on .pill { background: var(--accent); border-color: var(--accent); }
    .toggle-row.on .pill::after { transform: translateX(13px); background: var(--bg-panel); }
    .toggle-label-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .toggle-glyph {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-faint);
      flex-shrink: 0;
    }
    .toggle-glyph svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .toggle-row.on .toggle-glyph { color: var(--accent); }
    .toggle-label { font-size: 14px; color: var(--text-primary); font-family: var(--font-ui); font-weight: 500; user-select: none; }
    .pill { position: relative; width: 30px; height: 18px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 9px; transition: background 0.2s, border-color 0.2s; flex-shrink: 0; }
    .pill::after { content: ''; position: absolute; top: 1px; left: 1px; width: 14px; height: 14px; background: var(--text-faint); border-radius: 50%; transition: transform 0.2s, background 0.2s; }

    /* ── Issues ────────────────────────────────────────────────── */
    .issues-header { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 6px; border-bottom: 1px solid var(--border); margin-bottom: 2px; }
    .issues-header .section-label { border-bottom: none; padding-bottom: 0; }
    .issue-count {
      font-family: var(--font-ui);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--accent);
      background: transparent;
      padding: 0;
      border-radius: 0;
    }
    .issue-count.zero { color: var(--green); }
    .issue-list { display: flex; flex-direction: column; gap: 6px; }
    .issue-item {
      display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
      padding: 10px 12px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color 0.1s, background 0.1s, transform 0.1s;
      text-align: left;
      width: 100%;
      white-space: normal;
    }
    .issue-item:hover { background: var(--bg-hover); border-left-color: var(--accent-deep); transform: translateX(2px); }
    .issue-tag { font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .issue-tag:hover { text-decoration: underline; }
    .issue-tag.warn { color: var(--amber); }
    .issue-msg { font-size: 13px; color: var(--text-primary); font-family: var(--font-ui); line-height: 1.45; white-space: normal; overflow-wrap: anywhere; word-break: break-word; }
    .issue-msg code { font-family: var(--font-mono); font-size: 12px; background: var(--bg-raised); padding: 1px 5px; border-radius: 3px; color: var(--text-primary); }
    .empty-state { text-align: center; padding: 36px 20px; color: var(--text-muted); font-family: var(--font-ui); font-size: 14px; background: var(--bg-panel); border: 1px dashed var(--border); border-radius: var(--radius); }
    .invalidated-banner { padding: 10px 12px; background: var(--red-dim); color: var(--red); font-family: var(--font-mono); font-size: 13px; border-bottom: 1px solid var(--border); text-align: center; }

    /* ── AI alt check ────────────────────────────────────────── */
    .ai-check-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      position: relative;
    }
    .ai-check-section .section-label { margin-bottom: 0; }
    .ai-section { display: none; flex-direction: column; gap: 8px; margin-top: 4px; }
    .alt-check-result {
      padding: 7px 8px;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      color: var(--text-primary);
      line-height: 1.45;
    }
    .alt-check-result .ai-result-html {
      font-family: var(--font-ui);
      white-space: normal;
    }
    .alt-check-result .ai-result-error {
      font-family: var(--font-mono);
      white-space: pre-wrap;
      font-size: 12px;
      color: var(--text-muted);
      margin: 0;
    }
    .alt-check-result .ai-result-section { margin-bottom: 12px; }
    .alt-check-result .ai-result-section:last-child { margin-bottom: 0; }
    .alt-check-result .ai-result-subhead {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .alt-check-result .ai-result-none { color: var(--text-muted); margin: 0; font-style: italic; }
    .alt-check-result .ai-heading-issue-row {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      margin-bottom: 8px;
      background: var(--bg-panel);
    }
    .alt-check-result .ai-heading-issue-row:last-child { margin-bottom: 0; }
    .alt-check-result .ai-heading-issue-row-head {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .alt-check-result .ai-heading-issue-index {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 12px;
      color: var(--text-muted);
    }
    .alt-check-result .ai-heading-issue-desc {
      font-size: 14px;
      color: var(--text-primary);
      line-height: 1.4;
    }
    .alt-check-result .ai-heading-issue-row--clickable {
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }
    .alt-check-result .ai-heading-issue-row--clickable:hover {
      border-color: var(--accent);
      background: var(--bg-hover);
    }
    .alt-check-result .ai-heading-issue-row--clickable:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .alt-check-result .ai-wcag-pill {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--amber);
      background: var(--accent-dim);
      padding: 1px 5px;
      border-radius: 3px;
      margin-bottom: 4px;
    }
    .alt-check-result .ai-recommendation-text { margin: 0; font-size: 14px; color: var(--text-primary); line-height: 1.45; }
    .alt-check-result .ai-img-row {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      margin-bottom: 8px;
      background: var(--bg-panel);
    }
    .alt-check-result .ai-img-row:last-child { margin-bottom: 0; }
    .alt-check-result .ai-img-row-head {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .alt-check-result .ai-img-index {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 12px;
      color: var(--text-muted);
    }
    .alt-check-result .ai-status-pill {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .alt-check-result .ai-status-pill.ai-st-good { background: var(--green-dim); color: var(--green); }
    .alt-check-result .ai-status-pill.ai-st-generic { background: var(--accent-dim); color: var(--amber); }
    .alt-check-result .ai-status-pill.ai-st-missing { background: var(--red-dim); color: var(--red); }
    .alt-check-result .ai-status-pill.ai-st-dec-ok { background: var(--green-dim); color: var(--green); }
    .alt-check-result .ai-status-pill.ai-st-dec-wrong { background: var(--red-dim); color: var(--red); }
    .alt-check-result .ai-status-pill.ai-st-default { background: var(--bg-hover); color: var(--text-muted); }
    .alt-check-result .ai-img-reason { font-size: 14px; color: var(--text-primary); line-height: 1.4; }
    .alt-check-result .ai-img-row--clickable {
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }
    .alt-check-result .ai-img-row--clickable:hover {
      border-color: var(--accent);
      background: var(--bg-hover);
    }
    .alt-check-result .ai-img-row--clickable:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Alt / heading AI review: flat container (rows keep their own card borders) */
    #alt-check-result.alt-text-review-result,
    #heading-check-result.heading-text-review-result {
      background: transparent;
      border: none;
      padding-left: 2px;
      padding-right: 2px;
    }

    .ai-model-wrap { margin-top: 4px; padding-top: 10px; border-top: 1px dashed var(--border); }
    .ai-model-fieldset {
      border: none;
      margin: 0;
      padding: 0;
      min-width: 0;
    }
    .ai-model-legend {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 0;
      margin-bottom: 6px;
    }
    .ai-model-radio-group { display: flex; flex-direction: column; gap: 4px; }
    .ai-model-radio-row {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
      font-family: var(--font-ui);
      color: var(--text-primary);
      padding: 6px 8px;
      border-radius: 4px;
      transition: background 0.1s;
    }
    .ai-model-radio-row:hover { background: var(--bg-hover); }
    .ai-model-radio-row input {
      margin: 0;
      flex-shrink: 0;
      cursor: pointer;
      accent-color: var(--accent);
    }
    .ai-model-radio-row:focus-within {
      outline: none;
    }
    .ai-model-radio-row input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .ai-key-error {
      margin-top: 10px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--red);
      background: var(--red-dim);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--font-mono);
      white-space: pre-wrap;
    }
    .ai-key-error[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="dog-wrap">
        <!-- src is swapped by setMood() in panel.js -->
        <img id="barkerSvg" src="assets/dog/barker-judgemental.svg" width="60" height="60" alt="">
      </div>
      <div class="header-text">
        <div class="header-title">A11y Barker</div>
        <div class="header-status judgemental" id="statusText">Waiting to sniff…</div>
      </div>
      <!-- Theme toggle — icon and aria-label set by panel.js -->
      <button class="btn-theme" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme"></button>
    </div>
    <div class="invalidated-banner" id="invalidated-banner" style="display:none">
      Extension was reloaded. Close and reopen DevTools, or refresh the page.
    </div>
    <div class="sidebar-body">
      <!-- Button content (icon + label) is injected by panel.js on load -->
      <button class="btn-scan" id="scan-btn" data-state=""></button>
      <button class="btn-export" id="export-btn"></button>
      <div class="section-label">Overlays</div>
      <div class="toggles" id="toggles"></div>
      <div id="ai-check-section" class="ai-check-section" style="display:none">
        <div class="section-label">AI Check</div>
        <div class="toggles" id="ai-check-toggles"></div>
        <div id="ai-model-wrap" class="ai-model-wrap" style="display: none">
          <fieldset class="ai-model-fieldset">
            <legend class="ai-model-legend">Claude model</legend>
            <div id="ai-model-radio-group" class="ai-model-radio-group">
              <label class="ai-model-radio-row">
                <input type="radio" name="ai-model" id="ai-model-haiku" value="claude-haiku-4-5-20251001" />
                <span>Haiku — faster (default)</span>
              </label>
              <label class="ai-model-radio-row">
                <input type="radio" name="ai-model" id="ai-model-sonnet" value="claude-sonnet-4-5-20251022" />
                <span>Sonnet — more accurate</span>
              </label>
            </div>
          </fieldset>
          <div id="ai-key-error" class="ai-key-error" role="alert" hidden></div>
        </div>
      </div>
      <div class="issues-header" id="issues-header" style="display:none">
        <span class="section-label">Issues found</span>
        <div class="issue-count" id="issue-count">0</div>
      </div>
      <div id="issue-area">
        <div class="empty-state" id="issue-empty">Click Sniff to find issues</div>
        <div class="issue-list" id="issue-list" style="display:none"></div>
      </div>
      <div id="ai-heading-section" class="ai-section" style="display:none">
        <div class="section-label">Heading structure review</div>
        <div id="heading-check-result" class="alt-check-result heading-text-review-result" aria-live="polite"></div>
      </div>
      <div id="ai-section" class="ai-section" style="display:none">
        <div class="section-label">Alt text review</div>
        <div id="alt-check-result" class="alt-check-result alt-text-review-result" aria-live="polite"></div>
      </div>
    </div>
  </div>
  <script src="rules-registry.js"></script>
  <script src="panel.js"></script>
</body>
</html>
